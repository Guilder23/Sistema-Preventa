{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña actualizada</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link rel="stylesheet" href="{% static 'css/usuarios/recuperar_password.css' %}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h1 class="login-title">¡Contraseña actualizada!</h1>
                <p class="login-subtitle">Tu cuenta ya tiene una nueva contraseña. Ahora puedes iniciar sesión.</p>
            </div>

            <div class="login-footer">
                <a href="{% url 'login' %}" class="btn btn-login">Ir a iniciar sesión</a>
            </div>
        </div>
    </div>
</body>
</html>
